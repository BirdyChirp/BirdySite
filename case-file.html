<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case File — Birdy Chirp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>

<script src="site.js"></script>

<section class="page-banner">
  <div class="hero-halftone"></div>
  <div class="wrap">
    <a href="case-files.html" class="back-link">&larr; Back to Case Files</a>
    <h1 id="case-title" class="display">Loading file…</h1>
  </div>
</section>

<div class="wrap">
  <div class="reader">
    <div class="reader-date" id="case-date"></div>
    <div class="reader-body" id="case-body"></div>
  </div>
</div>

<script src="cases-data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('story');
  const story = CASE_FILES.find(s => s.slug === slug) || CASE_FILES[0];

  document.title = `${story.title} — Birdy Chirp`;
  document.getElementById('case-title').textContent = story.title;
  document.getElementById('case-date').textContent = story.date;
  document.getElementById('case-body').innerHTML = marked.parse(story.content);
</script>

</body>
</html>
